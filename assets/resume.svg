<g class="panel panel-4"><rect x="574" y="342" width="282" height="166" rx="18" fill="#0a2928" stroke="#1c8277"/><text x="596" y="375" class="section">Languages</text><text x="832" y="375" text-anchor="end" class="label">COMMUNICATION</text><g class="language-row row-0" transform="translate(602 408)"><text x="0" y="0" class="language-name">Persian</text><text x="225" y="0" text-anchor="end" class="language-level">Native</text><rect x="0" y="15" width="225" height="5" rx="3" fill="#1c4644"/><rect x="0" y="15" width="225" height="5" rx="3" fill="#83ffe8" class="language-bar"/></g><g class="language-row row-1" transform="translate(602 464)"><text x="0" y="0" class="language-name">English</text><text x="225" y="0" text-anchor="end" class="language-level">Professional</text><rect x="0" y="15" width="225" height="5" rx="3" fill="#1c4644"/><rect x="0" y="15" width="184" height="5" rx="3" fill="#4387ff" class="language-bar"/></g></g>
